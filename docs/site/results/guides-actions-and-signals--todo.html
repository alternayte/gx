<!--gx-result get="/todo" title="To do" html="" body="bg-background text-foreground"-->
<header class="border-b border-border">
  <nav class="mx-auto flex max-w-3xl items-center gap-4 p-4 text-sm">
    <a class="font-semibold" href="/" data-gx-active="page">Acme</a>
  </nav>
</header>
<main class="mx-auto max-w-3xl p-4"><div data-gx-slot="layout.go:8-1kv42c9" style="display:contents">


<h1 class="text-2xl font-semibold" data-signals="{&#34;todo&#34;:{&#34;IndexView&#34;:{&#34;open&#34;:false,&#34;title&#34;:&#34;&#34;}}}" data-gx-instance="todo.IndexView">To do</h1>
<div class="mt-4 flex gap-2">
  <input class="rounded-md border border-border px-3 py-2" type="text" data-bind="todo.IndexView.title">
  <button class="rounded-md bg-primary px-3 py-1.5 text-sm text-primary-foreground" data-on:click="@post(&#39;/todo/add&#39;, {headers: {&#39;Gx-Scope&#39;: &#39;todo.IndexView&#39;}})">Add</button>
  <button class="rounded-md border border-border px-3 py-1.5 text-sm" data-on:click="@post(&#39;/todo/clear&#39;, {headers: {&#39;Gx-Scope&#39;: &#39;todo.IndexView&#39;}})">Clear</button>
</div>
<p class="mt-2 text-sm text-muted-foreground">New item: <span data-text="$[&#34;todo&#34;][&#34;IndexView&#34;][&#34;title&#34;]"></span></p>

<ul id="indexView-items" class="mt-4 list-disc pl-5" data-gx-h="8b242cb1">
  
</ul>
<button class="mt-4 text-sm underline" data-on:click="$[&#34;todo&#34;][&#34;IndexView&#34;][&#34;open&#34;] = !$[&#34;todo&#34;][&#34;IndexView&#34;][&#34;open&#34;]" data-attr:aria-expanded="$[&#34;todo&#34;][&#34;IndexView&#34;][&#34;open&#34;]">Help</button>
<p data-show="$[&#34;todo&#34;][&#34;IndexView&#34;][&#34;open&#34;]" data-class:font-semibold="$[&#34;todo&#34;][&#34;IndexView&#34;][&#34;open&#34;]">Write a title and press Add.</p>
<p class="mt-4 text-sm" data-on-intersect="@get(&#39;/todo/count&#39;, {headers: {&#39;Gx-Scope&#39;: &#39;todo.IndexView&#39;}})">
  <span id="todo-count">Counting</span>
</p>
</div></main>
