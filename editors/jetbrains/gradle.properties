# The Gx plugin for GoLand and the other JetBrains IDEs (REQ-TLS-07).
org.gradle.jvmargs=-Xmx2g
kotlin.stdlib.default.dependency=false
# The IDE that the build compiles against and that the tests start. Set
# gx.ide.path to the directory of an installed IDE to use it, for example
# -Pgx.ide.path=/Applications/GoLand.app. With no path, Gradle downloads
# GoLand of this version.
gx.ide.version=2025.1
# The product of gx.ide.path for the UI smoke test: GO (GoLand) or IU
# (IntelliJ IDEA).
gx.ide.product=GO
