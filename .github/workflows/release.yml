name: release

# Builds the gx command for the platforms of SDD section 3.5 and attaches the
# archives to the GitHub release of the tag. It runs for each new version tag.
# Run it by hand with a tag to build the binaries of a tag that exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The build script comes from the commit of the workflow. The source
      # comes from the tag.
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: src/go.sum
      - name: Build the archives
        run: GX_SRC=src tools/scripts/release-binaries.sh "$TAG" dist
      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Gx ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
