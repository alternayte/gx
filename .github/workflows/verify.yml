name: verify

on:
  push:
    branches: [main]
  pull_request:

# A new push stops the run of the older commit.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate: build, vet, runtime, every test, the checks and the browser
  # suite, on one platform with the latest Go. A release tag needs this job
  # green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: extractions/setup-just@v2
      - uses: oven-sh/setup-bun@v2
      # Ubuntu 23.10 and later stop the Chrome sandbox: AppArmor denies
      # user namespaces to a program with no profile. The MCP tools start
      # headless Chrome with its sandbox on, so the runner allows them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: just build vet runtime test checks
      - run: just e2e

  # The other platforms and the older Go release build everything and run
  # the fast packages. They find path, line-ending and executable-name
  # defects. The slow packages build many apps and run in the gate job only
  # (see docs/build/decisions.md).
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            go: "1.26"
          - os: windows-latest
            go: "1.26"
          - os: ubuntu-latest
            go: "1.25"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: extractions/setup-just@v2
      - run: just build vet test-fast

  # NFR-07: every default user workflow runs with no node tool on the PATH.
  # The golang image holds Go and git, and no node, npm or bun.
  no-node:
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - uses: actions/checkout@v4
      - name: The PATH holds no node tool
        run: |
          for tool in node npm npx bun pnpm yarn deno; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool is on the PATH" >&2
              exit 1
            fi
          done
      # The checkout belongs to another user inside the container.
      - run: git config --global --add safe.directory '*'
      - run: go test ./gxcli -run 'TestNFR_07' -count=1 -v
