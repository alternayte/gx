name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: extractions/setup-just@v2
      - uses: oven-sh/setup-bun@v2
      # Ubuntu 23.10 and later stop the Chrome sandbox: AppArmor denies
      # user namespaces to a program with no profile. The MCP tools start
      # headless Chrome with its sandbox on, so the runner allows them.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Build, vet, runtime, tests and checks run on every platform.
      - run: just build vet runtime test checks
      # The browser suite runs on Linux and macOS. Windows runners cannot
      # drive the example apps reliably (see docs/build/decisions.md).
      - if: runner.os != 'Windows'
        run: just e2e

  # NFR-07: every default user workflow runs with no node tool on the PATH.
  # The golang image holds Go and git, and no node, npm or bun.
  no-node:
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - uses: actions/checkout@v4
      - name: The PATH holds no node tool
        run: |
          for tool in node npm npx bun pnpm yarn deno; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool is on the PATH" >&2
              exit 1
            fi
          done
      # The checkout belongs to another user inside the container.
      - run: git config --global --add safe.directory '*'
      - run: go test ./gxcli -run 'TestNFR_07' -count=1 -v
